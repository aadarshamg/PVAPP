<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Confirm your signup</title>
</head>
<body style="margin:0; padding:0; background-color:#f8fafc; font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding-bottom:24px;">
              <div style="font-size:40px; line-height:1;">🍕</div>
              <h1 style="font-size:22px; font-weight:900; color:#22973a; margin:8px 0 0;">Pizza Virus</h1>
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td style="background:#ffffff; border-radius:20px; padding:32px 24px; box-shadow:0 4px 16px rgba(0,0,0,0.06); text-align:center;">
              <h2 style="font-size:18px; font-weight:800; color:#0f172a; margin:0 0 8px;">Verify your email</h2>
              <p style="font-size:14px; color:#64748b; margin:0 0 24px; line-height:20px;">
                Enter this code in the app to finish creating your account.
              </p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background:#f0fdf4; border:1.5px solid #bbf7d0; border-radius:14px; padding:16px; text-align:center;">
                    <span style="font-size:32px; font-weight:900; letter-spacing:8px; color:#16a34a;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <p style="font-size:12px; color:#94a3b8; margin:24px 0 0;">
                This code expires shortly. If you didn't create a Pizza Virus account, you can safely ignore this email.
              </p>

              <p style="font-size:12px; color:#94a3b8; margin:16px 0 0;">
                Prefer a link instead? <a href="{{ .ConfirmationURL }}" style="color:#22973a; font-weight:700; text-decoration:none;">Confirm your email</a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:24px;">
              <p style="font-size:11px; color:#cbd5e1; margin:0;">Pizza Virus &middot; Hunger is a Deadly Virus</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
